<!doctype html><html><head><meta charset="utf-8"><style>body{margin:0;background:#141518}</style></head><body>
<script src="common.js"></script>
<script>
rect(0, 0, 1200, 640, C.ground);
header('Engine: 48000 Hz  ·  16 voices  ·  145 parameters, 120 of them on the grid');

// ---- PARTIAL MATRIX ---------------------------------------------------
section(16, 72, 832, 552, 'PARTIAL MATRIX', 'every partial, every setting - drag across a row to draw it', C.amber, { subx: 150 });

// live spectrum
screen(30, 110, 804, 80, { nx: 10, ny: 3 });
text(38, 124, 'LIVE · last voice C4 · after filter and envelopes', { size: 9.5, font: MONO, fill: C.muted });
text(826, 124, 'outputs 1004 – 1013', { size: 9.5, font: MONO, fill: C.dim, anchor: 'end' });
const cx0 = 140, cw = 69.4;
const live = [0.88, 0.62, 0.40, 0.44, 0.30, 0.22, 0.12, 0.05, 0.03, 0.02];
for (let i = 0; i < 10; i++) {
  const x = cx0 + i * cw + cw / 2, base = 184, H = 52;
  rect(x - 10, base - H * P.level[i], 20, H * P.level[i], 'none', hexA(C.amber, 0.35), 2, 1, 'stroke-dasharray="2 2"');
  rect(x - 10, base - H * live[i], 20, H * live[i], hexA(C.amber, 0.85), null, 2);
}
text(38, 182, 'set level', { size: 9, font: MONO, fill: C.dim }); rect(98, 175, 12, 8, 'none', hexA(C.amber, 0.5), 1, 1, 'stroke-dasharray="2 2"');

// column headers
const SEL = 2;
rect(cx0 + SEL * cw + 2, 196, cw - 4, 420, hexA(C.amber, 0.06), hexA(C.amber, 0.22), 6);
for (let i = 0; i < 10; i++) {
  const x = cx0 + i * cw + cw / 2;
  text(x, 212, i + 1, { size: 11, weight: 800, anchor: 'middle', fill: i === SEL ? C.amber : C.title });
}
text(30, 212, 'PARTIAL', { size: 9.5, weight: 700, fill: C.subtle, ls: 0.6 });

let y = 222;
const rowLabel = (yy, s, col = C.title, preset = true) => {
  text(30, yy, s, { size: 9.5, weight: 700, fill: col, ls: 0.3 });
  if (preset) { rect(118, yy - 10, 14, 13, C.seg, C.border, 3); path(`M${121},${yy - 5} L${125},${yy - 1} L${129},${yy - 5}`, C.muted, 1.2); }
};
const barCell = (i, yy, h, v, col, label, bip = false) => {
  const x = cx0 + i * cw + 5, w = cw - 10;
  rect(x, yy, w, h, C.track, null, 3);
  if (bip) {
    const mid = x + w / 2, e = x + w * v;
    rect(Math.min(mid, e), yy, Math.max(1.5, Math.abs(e - mid)), h, hexA(col, 0.6), null, 2);
    line(mid, yy - 1, mid, yy + h + 1, C.dim, 1);
  } else if (v > 0) rect(x, yy, w * v, h, hexA(col, i === SEL ? 0.8 : 0.55), null, 3);
  text(x + w / 2, yy + h / 2 + 3.4, label, { size: 9, font: MONO, anchor: 'middle', fill: v > 0 || bip ? C.text : C.subtle });
};
const lampCell = (i, yy, on, col) => lamp(cx0 + i * cw + cw / 2, yy, on, col, 4.5);

// LEVEL - drawbar row
rowLabel(y + 30, 'LEVEL');
for (let i = 0; i < 10; i++) {
  const x = cx0 + i * cw + cw / 2, top = y + 4, H = 46;
  rect(x - 12, top, 24, H, C.track, null, 3);
  rect(x - 12, top + H - H * P.level[i], 24, H * P.level[i], hexA(C.amber, i === SEL ? 0.95 : 0.7), null, 3);
  text(x + 28, top + H - 2, Math.round(P.level[i] * 100), { size: 8.5, font: MONO, anchor: 'end', fill: C.subtle });
}
y += 58;
rowLabel(y + 13, 'PHASE');
for (let i = 0; i < 10; i++) barCell(i, y + 3, 14, P.phase[i], C.amber, (P.phase[i] === 0.5 ? '0°' : `${Math.round((P.phase[i] - 0.5) * 180)}°`), true);
y += 22;
rowLabel(y + 13, 'INVERT', C.title, false);
for (let i = 0; i < 10; i++) lampCell(i, y + 9, P.inv[i], C.lampOn);
y += 22;

// FORMANT ENVELOPE group
line(30, y + 4, 834, y + 4, C.rule, 1);
subhead(30, y + 19, 'FORMANT ENVELOPES', C.amber);
y += 26;
rowLabel(y + 12, 'ENV ON', C.title, false);
for (let i = 0; i < 10; i++) lampCell(i, y + 8, P.env[i], C.amber);
y += 20;
rowLabel(y + 12, 'ENV INV', C.title, false);
for (let i = 0; i < 10; i++) lampCell(i, y + 8, P.envInv[i], C.lampOn);
y += 20;
const tf = s => Math.min(1, Math.log(s / 0.0005) / Math.log(10 / 0.0005));
const rows = [
  ['ATTACK', P.A, s => tf(s), ms],
  ['DECAY', P.D, s => tf(s), ms],
  ['SUSTAIN', P.S, v => v, pc],
  ['RELEASE', P.R, s => tf(s), ms],
  ['ENV LEVEL', P.envLvl, v => v, pc]
];
const decayY = y + 22 * 1;
rows.forEach(([lab, arr, fr, fmt]) => {
  rowLabel(y + 13, lab);
  for (let i = 0; i < 10; i++) barCell(i, y + 3, 15, P.env[i] ? fr(arr[i]) : fr(arr[i]), C.amber, fmt(arr[i]));
  y += 22;
});

// HARMONIC LFO group
line(30, y + 4, 834, y + 4, C.rule, 1);
subhead(30, y + 19, 'HARMONIC LFOS', C.violet);
y += 26;
rowLabel(y + 13, 'RATE');
for (let i = 0; i < 10; i++) barCell(i, y + 3, 15, P.lfoRate[i], C.violet, P.lfoRate[i] ? `${(P.lfoRate[i] * 4).toFixed(2)} Hz` : 'off');
y += 22;
rowLabel(y + 13, 'DEPTH');
for (let i = 0; i < 10; i++) barCell(i, y + 3, 15, P.lfoDepth[i], C.violet, P.lfoDepth[i] ? pc(P.lfoDepth[i]) : 'off');
y += 22;

// a stroke being drawn across the DECAY row
const dy = decayY + 10;
path(`M${cx0 + 3 * cw + 10},${dy - 6} L${cx0 + 9 * cw + 50},${dy + 3}`, C.text, 1.5, 'none', 'stroke-dasharray="4 3" opacity="0.8"');
circle(cx0 + 9 * cw + 50, dy + 3, 4, C.text);
rect(cx0 + 5 * cw, dy - 40, 236, 22, '#26282d', C.capEdge, 5);
text(cx0 + 5 * cw + 10, dy - 25, 'Shift-drag: straight line · decay 300 → 120 ms', { size: 9.5, fill: C.text });

// row-preset menu, open on LEVEL
rect(136, 236, 132, 112, '#24262b', C.capEdge, 6, 1, 'filter="none"');
['1 / k   (saw)', 'odd only   (square)', '1 / k²   (triangle)', 'flat', 'random', 'invert'].forEach((s, i) => {
  if (i === 0) rect(140, 241, 124, 17, hexA(C.amber, 0.25), null, 3);
  text(148, 253 + i * 17, s, { size: 10, fill: i === 0 ? C.text : C.title });
});

// ---- SPECTRAL FILTER --------------------------------------------------
section(864, 72, 320, 288, 'SPECTRAL FILTER', null, C.blue);
filterScreen(878, 108, 292, 70, { dots: true, sel: 3, f0: 262, right: '2.40k' });
shapeSwitches(878, 188, 292, 26, 19);
[['2.40k', 'CUTOFF', 0.62], ['35 %', 'Q', 0.35], ['4', 'POLES', 0.6], ['+60 %', 'ENV LVL', 0.8]].forEach((k, i) =>
  knob(906 + i * 72, 260, 16, k[2], C.blue, k[0], k[1], { bipolar: i === 3 }));
[['20 ms', 'A', 0.25], ['350 ms', 'D', 0.5], ['30 %', 'S', 0.3], ['300 ms', 'R', 0.45]].forEach((k, i) =>
  knob(1000 + i * 46, 318, 10, k[2], C.blue, k[0], k[1], { vs: 8.5, ls: 8.5, vgap: 10, lgap: 10 }));
envScreen(878, 304, 96, 40, C.blue, 0.02, 0.35, 0.3, 0.3, { total: 1.3, keyUp: 0.8, nx: 4, ny: 2 });

// ---- AMP --------------------------------------------------------------
section(864, 368, 320, 140, 'AMP', null, C.mint);
envScreen(878, 404, 104, 62, C.mint, 0.003, 0.6, 0.7, 0.42, { total: 1.4, keyUp: 0.85, nx: 4, ny: 2, lvl: 0.85 });
[['3 ms', 'A', 0.08], ['600 ms', 'D', 0.52], ['70 %', 'S', 0.7], ['420 ms', 'R', 0.5], ['100 %', 'LVL', 1]].forEach((k, i) =>
  knob(1006 + i * 37, 428, 12, k[2], C.mint, k[0], k[1], { vs: 8.5, ls: 8.5, vgap: 11, lgap: 11 }));
text(878, 492, 'One amplitude ADSR over the ten formant envelopes', { size: 9.5, fill: C.subtle });

// ---- OUTPUT + MOTION --------------------------------------------------
section(864, 520, 320, 104, 'OUTPUT · MOTION', null, C.violet);
[['5.2', 'VIB R', 0.45, C.violet], ['12 %', 'VIB D', 0.12, C.violet], ['3.0', 'TRM R', 0.3, C.violet], ['off', 'TRM D', 0, C.violet],
 ['−20 dB', 'LEVEL', 0.5, C.mint], ['C', 'PAN', 0.5, C.mint], ['off', 'GLIDE', 0, C.amber]].forEach((k, i) =>
  knob(886 + i * 39, 580, 11, k[2], k[3], k[0], k[1], { vs: 8, ls: 8, vgap: 10, lgap: 10, bipolar: k[1] === 'PAN' }));
lamp(1164, 580, 1, C.mint, 5);
text(1164, 603, 'LAD', { size: 8, weight: 700, anchor: 'middle', fill: C.title });

render();
</script></body></html>
